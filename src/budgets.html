<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./assets/icons/favicon-32x32.png" type="image/png" />

    <title>Personal Finance App | Budgets</title>

    <link href="./css/output.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/6d0d529000.js"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>

  <body>
    <div id="app-container" class="flex min-h-screen">
      <!-- SIDEBAR -->
      <aside
        class="fixed bottom-0 left-0 z-50 flex h-20 w-full shrink-0 p-4 bg-gray-900 rounded-tr-xl rounded-tl-xl xl:pl-0 xl:rounded-tl-none xl:fixed xl:h-screen xl:w-72 xl:flex-col xl:justify-between"
      >
        <div
          id="container"
          class="flex h-full w-full flex-row items-center overflow-hidden bg-gray-900 lg:h-screen lg:flex-col lg:items-start lg:pb-5 lg:pr-5 lg:pt-5"
        >
          <!-- LOGO -->
          <div class="logo hidden items-start pl-8 lg:mt-6 lg:flex">
            <img src="./assets/icons/logo-large.svg" alt="Finance" />
          </div>

          <!-- OVERVIEW -->
          <a
            href="../index.html"
            class="block h-full flex-1 lg:h-auto lg:w-full lg:flex-none"
          >
            <div
              class="relative mt-0 flex h-full w-full items-center justify-center rounded-none hover:bg-gray-700 hover:cursor-pointer lg:mt-16 lg:h-auto lg:justify-start lg:rounded-r-2xl lg:pb-4 lg:pl-8 lg:pr-4 lg:pt-4"
            >
              <i class="fa-solid fa-house text-xl text-gray-300 lg:mr-8"></i>

              <p class="hidden text-lg font-medium text-gray-300 lg:block">
                Overview
              </p>
            </div>
          </a>

          <!-- TRANSACTIONS -->
          <a
            href="./transactions.html"
            class="block h-full flex-1 lg:h-auto lg:w-full lg:flex-none"
          >
            <div
              class="mt-0 flex h-full w-full items-center justify-center rounded-none hover:cursor-pointer hover:bg-gray-700 lg:mt-2 lg:h-auto lg:justify-start lg:rounded-r-2xl lg:pb-4 lg:pl-8 lg:pr-4 lg:pt-4"
            >
              <i
                class="fa-solid fa-arrow-right-arrow-left fa-rotate-270 text-xl text-gray-300 lg:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-300 lg:block">
                Transactions
              </p>
            </div>
          </a>

          <!-- BUDGETS -->
          <a
            href="./budgets.html"
            class="block h-full flex-1 lg:h-auto lg:w-full lg:flex-none"
          >
            <div
              class="relative mt-0 flex h-full w-full items-center justify-center rounded-none bg-white rounded-tr-xl rounded-tl-xl hover:cursor-pointer lg:rounded-tl-none lg:mt-2 lg:h-auto lg:justify-start lg:rounded-r-2xl lg:pb-4 lg:pl-8 lg:pr-4 lg:pt-4"
            >
              <p
                class="absolute bottom-0 left-1/2 h-1 w-8 -translate-x-1/2 bg-emerald-300 lg:left-0 lg:top-0 lg:h-full lg:w-1 lg:translate-x-0"
              ></p>
              <i
                class="fa-solid fa-chart-pie text-xl text-[#277C78] lg:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-900 lg:block">
                Budgets
              </p>
            </div>
          </a>

          <!-- POTS -->
          <a
            href="./pots.html"
            class="block h-full flex-1 lg:h-auto lg:w-full lg:flex-none"
          >
            <div
              class="mt-0 flex h-full w-full items-center justify-center rounded-none hover:cursor-pointer hover:bg-gray-700 lg:mt-2 lg:h-auto lg:justify-start lg:rounded-r-2xl lg:pb-4 lg:pl-8 lg:pr-4 lg:pt-4"
            >
              <i
                class="fa-solid fa-sack-dollar text-xl text-gray-300 lg:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-300 lg:block">
                Pots
              </p>
            </div>
          </a>

          <!-- RECURRING BILLS -->
          <a
            href="./recurring_bills.html"
            class="block h-full flex-1 lg:h-auto lg:w-full lg:flex-none"
          >
            <div
              class="mt-0 flex h-full w-full items-center justify-center rounded-none hover:cursor-pointer hover:bg-gray-700 lg:mt-2 lg:h-auto lg:justify-start lg:rounded-r-2xl lg:pb-4 lg:pl-8 lg:pr-4 lg:pt-4"
            >
              <i class="fa-solid fa-receipt text-xl text-gray-300 lg:mr-8"></i>

              <p class="hidden text-lg font-medium text-gray-300 lg:block">
                Recurring Bills
              </p>
            </div>
          </a>

          <!-- MINIMIZE MENU -->
          <div
            id="minimize-menu"
            class="absolute bottom-8 left-0 hidden w-67 items-center rounded-r-2xl pb-4 pl-8 pr-4 pt-4 hover:cursor-pointer hover:bg-gray-700 lg:flex"
          >
            <i
              class="fa-solid fa-arrow-left-long mr-8 text-xl text-gray-300"
            ></i>

            <p class="text-lg font-medium text-gray-300">Minimize Menu</p>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main
        class="min-w-0 flex-1 bg-[#f8f4f0] p-4 pb-24 lg:p-8 lg:pb-8 xl:ml-72"
      >
        <!-- HEADER -->
        <header class="flex align-center justify-between">
          <h1 class="text-3xl font-bold lg:text-4xl">Overview</h1>
          <button
            id="new-budget-btn"
            class="p-4 w-auto bg-gray-900 text-white md:w-51.25 md:p-4 font-bold rounded-md hover:cursor-pointer"
          >
            + Add new Budget
          </button>
        </header>

        <!-- SUMMARY -->
        <section class="mt-8">
          <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
            <div class="mt-4 w-150">
              <canvas id="myChart"></canvas>
            </div>
            <div id="budget-container" class="mt-4 w-full"></div>
          </div>
        </section>
        <!-- Add New Pot Modal -->
        <div
          class="new-budget-modal fixed inset-0 bg-black/75 z-10 hidden justify-center"
        >
          <div
            class="bg-white min-h-[60vh] w-72 max-md:m-auto overflow-y-auto md:w-140 self-center z-30 p-6 rounded-md"
          >
            <div class="first-item flex align-center justify-between">
              <div>
                <p class="font-bold text-3xl text-gray-900">Add New Budget</p>
              </div>
              <i
                data-btn="4"
                id="close-new-budget-modal-btn"
                class="fa-solid fa-circle-plus fa-rotate-by text-3xl pt-1 hover:cursor-pointer"
                style="--fa-rotate-angle: 315deg"
              ></i>
            </div>
            <p class="mt-4 text-gray-500">
              Choose a category to set a spending budget. These categories can
              help you monitor spendings.
            </p>
            <div class="budget-form-container mt-4"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/actions.js"></script>
  </body>
</html>
