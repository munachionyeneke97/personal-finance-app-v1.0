<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./assets/icons/favicon-32x32.png" type="image/png" />

    <title>Personal Finance App | Recurring Bills</title>

    <link href="./css/output.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/6d0d529000.js"
      crossorigin="anonymous"
    ></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>

  <body>
    <div id="app-container" class="flex min-h-screen">
      <!-- SIDEBAR -->
      <aside
        class="fixed bottom-0 left-0 z-50 flex h-20 w-full shrink-0 p-4 bg-gray-900 rounded-tr-xl rounded-tl-xl xl:fixed xl:top-0 xl:pl-0 xl:rounded-tl-none xl:h-screen xl:w-72 xl:flex-col xl:justify-between"
      >
        <div
          id="container"
          class="flex h-full w-full flex-row items-center overflow-hidden bg-gray-900 xl:h-screen xl:flex-col xl:items-start xl:pb-5 xl:pr-5 xl:pt-5"
        >
          <!-- LOGO -->
          <div class="logo hidden items-start pl-8 xl:mt-6 xl:flex">
            <img src="./assets/icons/logo-large.svg" alt="Finance" />
          </div>

          <!-- OVERVIEW -->
          <a
            href="../index.html"
            class="block h-full flex-1 xl:h-auto xl:w-full xl:flex-none"
          >
            <div
              class="relative mt-0 flex h-full w-full items-center justify-center rounded-none hover:bg-gray-700 hover:cursor-pointer xl:mt-16 xl:h-auto xl:justify-start xl:rounded-r-xl xl:pb-4 xl:pl-8 xl:pr-4 xl:pt-4"
            >
              <i class="fa-solid fa-house text-xl text-gray-300 xl:mr-8"></i>

              <p class="hidden text-lg font-medium text-gray-300 xl:block">
                Overview
              </p>
            </div>
          </a>

          <!-- TRANSACTIONS -->
          <a
            href="./transactions.html"
            class="block h-full flex-1 xl:h-auto xl:w-full xl:flex-none"
          >
            <div
              class="mt-0 flex h-full w-full items-center justify-center rounded-none hover:cursor-pointer hover:bg-gray-700 xl:mt-2 xl:h-auto xl:justify-start xl:rounded-r-xl xl:pb-4 xl:pl-8 xl:pr-4 xl:pt-4"
            >
              <i
                class="fa-solid fa-arrow-right-arrow-left fa-rotate-270 text-xl text-gray-300 xl:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-300 xl:block">
                Transactions
              </p>
            </div>
          </a>

          <!-- BUDGETS -->
          <a
            href="./budgets.html"
            class="block h-full flex-1 xl:h-auto xl:w-full xl:flex-none"
          >
            <div
              class="mt-0 flex h-full w-full items-center justify-center rounded-none hover:cursor-pointer hover:bg-gray-700 xl:mt-2 xl:h-auto xl:justify-start xl:rounded-r-xl xl:pb-4 xl:pl-8 xl:pr-4 xl:pt-4"
            >
              <i
                class="fa-solid fa-chart-pie text-xl text-gray-300 xl:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-300 xl:block">
                Budgets
              </p>
            </div>
          </a>

          <!-- POTS -->
          <a
            href="./pots.html"
            class="block h-full flex-1 xl:h-auto xl:w-full xl:flex-none"
          >
            <div
              class="relative mt-0 flex h-full w-full items-center justify-center rounded-none hover:bg-gray-700 hover:cursor-pointer xl:mt-2 xl:h-auto xl:justify-start xl:rounded-r-xl xl:pb-4 xl:pl-8 xl:pr-4 xl:pt-4"
            >
              <i
                class="fa-solid fa-sack-dollar text-xl text-gray-300 xl:mr-8"
              ></i>

              <p class="hidden text-lg font-medium text-gray-300 xl:block">
                Pots
              </p>
            </div>
          </a>

          <!-- RECURRING BILLS -->
          <a
            href="./recurring_bills.html"
            class="block h-full flex-1 xl:h-auto xl:w-full xl:flex-none"
          >
            <div
              class="relative mt-0 flex h-full w-full items-center justify-center rounded-none bg-white rounded-tr-xl rounded-tl-xl hover:cursor-pointer xl:rounded-tl-none xl:mt-2 xl:h-auto xl:justify-start xl:rounded-r-2xl xl:pb-4 xl:pl-8 xl:pr-4 xl:pt-4"
            >
              <p
                class="absolute bottom-0 left-1/2 h-1 w-8 -translate-x-1/2 bg-emerald-300 xl:left-0 xl:top-0 xl:h-full xl:w-1 xl:translate-x-0"
              ></p>
              <i class="fa-solid fa-receipt text-xl text-[#277C87] xl:mr-8"></i>

              <p class="hidden text-lg font-medium text-gray-900 xl:block">
                Recurring Bills
              </p>
            </div>
          </a>

          <!-- MINIMIZE MENU -->
          <div
            id="minimize-menu"
            class="absolute bottom-8 left-0 hidden w-67 items-center rounded-r-2xl pb-4 pl-8 pr-4 pt-4 hover:cursor-pointer hover:bg-gray-700 xl:flex"
          >
            <i
              class="fa-solid fa-arrow-left-long mr-8 text-xl text-gray-300"
            ></i>

            <p class="text-lg font-medium text-gray-300">Minimize Menu</p>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main
        class="min-w-0 flex-1 bg-[#f8f4f0] p-4 pb-24 xl:p-8 xl:pb-8 xl:ml-72"
      >
        <!-- HEADER -->
        <header>
          <h1 class="text-3xl font-bold xl:text-4xl">Recurring Bills</h1>
        </header>

        <!-- SUMMARY -->
        <section id="recurring_bills-content" class="mt-8 rounded-xl">
          <div class="grid grid-cols-[1fr] xl:grid-cols-[1fr_2fr] gap-4">
            <div class="flex max-md:flex-col xl:flex-col gap-4">
              <!-- JavaScript (Render.js) will inject the data here -->
              <div
                id="total-bills"
                class="flex max-sm:flex-none max-xl:flex-1 min-h-40 flex-col rounded-2xl bg-gray-900 p-6"
              ></div>
            </div>
            <div id="recurring_bills-container" class="bg-white p-6 rounded-xl">
              <div class="flex items-center justify-between">
                <div
                  class="pl-4 pr-4 pt-3 pb-3 rounded-xl border md:w-44 md:mr-2 xl:w-90 xl:mr-8"
                >
                  <input
                    type="search"
                    placeholder="Search bills"
                    class="md:w-28 xl:w-75 border-0 border-none outline-0"
                  />
                  <i class="fa-solid fa-search"></i>
                </div>
                <!-- MOBILE -->
                <div
                  class="dropdown-container mobile-sort flex md:hidden items-center"
                >
                  <div class="relative flex items-center text-left mr-8">
                    <i
                      data-btn="1"
                      class="sort-btn fa-solid fa-arrow-up-short-wide fa-rotate-180 fa-xl"
                    ></i>
                    <!-- Dropdown Menu Box -->
                    <div
                      class="sort-dropdown hidden absolute top-12 right-8 z-10 mt-2 w-24 shadow-md rounded-sm bg-white"
                    >
                      <div class="py-1">
                        <a
                          data-sort="latest"
                          class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                          >Latest</a
                        >
                        <a
                          data-sort="oldest"
                          class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                          >Oldest</a
                        >
                        <div class="py-1">
                          <a
                            data-sort="a-z"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >A to Z</a
                          >
                          <a
                            data-sort="z-a"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Z to A</a
                          >
                          <a
                            data-sort="highest"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Highest</a
                          >
                          <a data-sort="lowest" class="block px-4 py-2 text-sm"
                            >Lowest</a
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- TABLETS & DESKTOPS  -->
                <div
                  class="dropdown-container desktop-sort hidden md:flex items-center"
                >
                  <div class="sort-box">
                    <div class="relative flex items-center text-left">
                      <span class="text-xl mr-6">Sort by</span>
                      <!-- Dropdown Trigger Button -->
                      <button
                        data-btn="1"
                        class="sort-btn w-24 flex items-center justify-between bg-white border rounded-xl px-4 py-2 text-gray-700 hover:cursor-pointer"
                      >
                        <span class="font-semibold md:mr-1 xl:mr-3"
                          >Latest</span
                        >
                        <i class="fa-solid fa-caret-down"></i>
                      </button>

                      <!-- Dropdown Menu Box -->
                      <div
                        class="sort-dropdown hidden absolute top-12 left-18 z-10 mt-2 w-28 origin-top-right shadow-md rounded-xl bg-white"
                      >
                        <div class="py-1">
                          <a
                            data-sort="latest"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Latest</a
                          >
                          <a
                            data-sort="oldest"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Oldest</a
                          >
                          <a
                            data-sort="a-z"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >A to Z</a
                          >
                          <a
                            data-sort="z-a"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Z to A</a
                          >
                          <a
                            data-sort="highest"
                            class="block px-4 py-2 text-sm border-b-2 border-gray-200 hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Highest</a
                          >
                          <a
                            data-sort="lowest"
                            class="block px-4 py-2 text-sm hover:bg-gray-500 hover:text-white hover:cursor-pointer"
                            >Lowest</a
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- RECURRING BILLS TABLE -->
              <div class="overflow-x-auto w-full rounded-xl mt-8">
                <table class="w-full text-left border-collapse">
                  <!-- Table Header -->
                  <thead>
                    <tr
                      class="border-b border-gray-100 text-sm font-medium text-gray-500 tracking-wider"
                    >
                      <th class="pb-4 font-normal">Bill Title</th>
                      <th class="pb-4 font-normal">Due Date</th>
                      <th class="pb-4 font-normal text-right">Amount</th>
                    </tr>
                  </thead>
                  <!-- Table Body -->
                  <!-- JavaScript (Render.js) will render recurring bills here -->
                  <tbody
                    id="recurring_bills-table"
                    class="divide-y divide-gray-100 text-sm font-medium text-gray-900"
                  ></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/actions.js"></script>
  </body>
</html>
